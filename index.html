/* ---------------- EVENTS ---------------- */
function bind(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=async ()=>{
    view=b.dataset.nav; showEditModal=false; showUploadShortModal=false; render(); window.scrollTo(0,0);
    if(view==='profile' || view==='explore'){
      await refreshMyCounts();
      await loadUsersDirectory();
      render();
    }
    if(view==='notifications'){
      await loadNotifications();
      render();
      markNotificationsRead();
    }
    if(view==='messages'){
      await loadThreads();
      render();
    }
  });

  const focusBtn = document.getElementById('focusComposer');
  if(focusBtn) focusBtn.onclick = ()=>{ view='home'; render(); setTimeout(()=>document.getElementById('postText')?.focus(),0); };

  const themeBtn = document.getElementById('themeToggle');
  if(themeBtn) themeBtn.onclick = ()=>{ document.documentElement.classList.toggle('dark'); render(); };

  const notifPermBtn = document.getElementById('notifPermBtn');
  if(notifPermBtn) notifPermBtn.onclick = requestDeviceNotifications;

  const textarea = document.getElementById('postText');
  const submitBtn = document.getElementById('submitPost');
  if(textarea){
    textarea.value = composerDraftText; // preserve text across re-renders (e.g. after picking media)
    const updateSubmitState = ()=>{
      const len = textarea.value.length;
      document.getElementById('charCount').textContent = `${len} / 280`;
      submitBtn.disabled = (len===0 && !pendingMedia) || len>280;
    };
    updateSubmitState();
    textarea.oninput = ()=>{ composerDraftText = textarea.value; updateSubmitState(); };

    const mediaBtn = document.getElementById('mediaBtn');
    const mediaInput = document.getElementById('mediaInput');
    if(mediaBtn) mediaBtn.onclick = ()=> mediaInput.click();
    if(mediaInput) mediaInput.onchange = ()=>{
      const file = mediaInput.files[0];
      if(!file) return;
      if(file.size > MAX_MEDIA_MB*1024*1024){
        alert(`That file is over ${MAX_MEDIA_MB}MB. Please pick something smaller.`);
        return;
      }
      const type = file.type.startsWith('video') ? 'video' : 'image';
      pendingMedia = { file, previewUrl:URL.createObjectURL(file), type };
      render();
    };
    const removeMedia = document.getElementById('removeMedia');
    if(removeMedia) removeMedia.onclick = ()=>{ pendingMedia=null; render(); };

    submitBtn.onclick = async ()=>{
      const text = textarea.value.trim();
      if(!text && !pendingMedia) return;
      submitBtn.disabled = true;
      let mediaUrl = null, mediaType = null;
      if(pendingMedia){
        mediaType = pendingMedia.type;
        try{
          uploadPct = 0; render();
          mediaUrl = await uploadToStorage(pendingMedia.file, pct=>{ uploadPct = pct; document.querySelector('.upload-progress-bar') && (document.querySelector('.upload-progress-bar').style.width = pct+'%', document.querySelector('.upload-label').textContent = 'Uploading… '+pct+'%'); });
        }catch(err){
          console.error(err);
          uploadPct = null;
          alert('Upload failed: '+err.message);
          render();
          return;
        }
        uploadPct = null;
      }
      const newPost = { author:ME.name, handle:ME.handle, authorId:ME.uid, photoUrl:ME.photoUrl||null, createdAt:Date.now(), text, mediaUrl, mediaType, likes:0 };
      try{
        const res = await fbPost('posts', newPost);
        posts.push({ ...newPost, id:res.name, liked:false, comments:[] });
        syncStatus='online';
      }catch(err){
        console.error(err);
        posts.push({ ...newPost, id:'local-'+Date.now(), liked:false, comments:[] });
        syncStatus='offline';
      }
      composerDraftText = '';
      pendingMedia = null;
      render();
    };
  }

  document.querySelectorAll('[data-like]').forEach(b=>b.onclick=async ()=>{
    const p = posts.find(p=>p.id==b.dataset.like);
    const newLiked = !p.liked;
    p.liked = newLiked;
    p.likes += newLiked ? 1 : -1;
    render();
    try{
      if(newLiked) await fbPatch(`posts/${p.id}/likedBy`, { [ME.uid]: true });
      else await fbDelete(`posts/${p.id}/likedBy/${ME.uid}`);
      syncStatus='online';
      if(newLiked && p.authorId) sendNotification(p.authorId, { type:'like_post', text:`${ME.name} liked your post`, targetId:p.id });
    }catch(err){ console.error(err); syncStatus='offline'; }
  });

  document.querySelectorAll('[data-toggle-comments]').forEach(b=>b.onclick=()=>{
    const el = document.getElementById('comments-'+b.dataset.toggleComments);
    el.style.display = el.style.display==='none' ? 'flex' : 'none';
  });

  document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{
    b.querySelector('span').textContent = 'Copied';
    setTimeout(()=>{ b.querySelector('span').textContent='Share'; },1200);
  });

  document.querySelectorAll('[data-post-download]').forEach(b=>b.onclick=()=>{
    const p = posts.find(p=>p.id==b.dataset.postDownload);
    if(p && p.mediaUrl) window.open(downloadUrlFor(p.mediaUrl), '_blank');
  });

  document.querySelectorAll('[data-comment-submit]').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.commentSubmit;
    const input = document.querySelector(`[data-comment-input="${id}"]`);
    const text = input.value.trim();
    if(!text) return;
    const comment = { name:ME.name, text, createdAt:Date.now() };
    const post = posts.find(p=>p.id==id);
    try{
      const res = await fbPost('posts/'+id+'/comments', comment);
      post.comments.push({ ...comment, id:res.name });
      syncStatus='online';
      if(post.authorId) sendNotification(post.authorId, { type:'comment_post', text:`${ME.name} commented: "${text.slice(0,60)}"`, targetId:id });
    }catch(err){
      console.error(err);
      post.comments.push({ ...comment, id:'local-'+Date.now() });
      syncStatus='offline';
    }
    render();
    setTimeout(()=>document.getElementById('comments-'+id).style.display='flex',0);
  });

  /* Shorts: autoplay whichever short is in view, pause the rest */
  const shortsWrap = document.getElementById('shortsWrap');
  if(shortsWrap){
    const videos = shortsWrap.querySelectorAll('video[data-video]');
    const io = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        const vid = e.target;
        vid._wasIntersecting = e.isIntersecting;
        if(e.isIntersecting){
          vid.muted = !shortsSoundOn;
          const btn = vid.closest('.short')?.querySelector('[data-mute]');
          if(btn) btn.innerHTML = vid.muted ? icon.mute : icon.unmute;
          vid.play().catch(()=>{});
        }
        else{ vid.pause(); }
      });
    }, { root:shortsWrap, threshold:0.6 });
    videos.forEach(v=>{
      io.observe(v);

      // Some connections stall a few seconds into buffering and never recover
      // on their own — that used to require a manual page refresh to fix.
      // Detect it and reload the same video automatically instead.
      const forceReload = ()=>{
        const src = v.currentSrc || v.src;
        if(!src) return;
        const wasIntersecting = v._wasIntersecting;
        v.load();
        if(wasIntersecting) v.play().catch(()=>{});
      };
      v.addEventListener('error', forceReload);
      v.addEventListener('stalled', ()=>{
        clearTimeout(v._stallTimer);
        v._stallTimer = setTimeout(()=>{ if(v.readyState < 3) forceReload(); }, 4000);
      });
      v.addEventListener('waiting', ()=>{
        clearTimeout(v._stallTimer);
        v._stallTimer = setTimeout(()=>{ if(v.readyState < 3) forceReload(); }, 4000);
      });
      v.addEventListener('playing', ()=>clearTimeout(v._stallTimer));
    });

    shortsWrap.querySelectorAll('[data-mute]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      toggleShortSound(b.closest('.short'));
    });
    shortsWrap.querySelectorAll('[data-short-like]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      const s = shorts.find(sh=>sh.id===b.dataset.shortLike);
      if(s) setShortLiked(s.id, !s.liked);
    });
    shortsWrap.querySelectorAll('[data-short-share]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      b.querySelector('span').textContent = 'Copied';
      setTimeout(()=>{ b.querySelector('span').textContent='Share'; },1200);
    });
    shortsWrap.querySelectorAll('[data-short-comment]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      openShortComments(b.dataset.shortComment);
    });
    shortsWrap.querySelectorAll('[data-short-download]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      const s = shorts.find(sh=>sh.id===b.dataset.shortDownload);
      if(s && s.src) window.open(downloadUrlFor(s.src), '_blank');
    });
    shortsWrap.querySelectorAll('[data-short-report]').forEach(b=>b.onclick=async (e)=>{
      e.stopPropagation();
      const s = shorts.find(sh=>sh.id===b.dataset.shortReport);
      if(!s) return;
      if(!confirm('Report this video as inappropriate?')) return;
      await reportShort(s);
    });
    shortsWrap.querySelectorAll('[data-open-creator-short]').forEach(el=>el.onclick=(e)=>{
      e.stopPropagation();
      openCreatorProfile(el.dataset.openCreatorShort);
    });

    // Double-tap (or double-click) anywhere on the video to like it, TikTok/Reels-style
    shortsWrap.querySelectorAll('.short').forEach(shortEl=>{
      let lastTap = 0;
      shortEl.addEventListener('click', (e)=>{
        if(e.target.closest('button')) return; // rail/mute buttons handle themselves
        const now = Date.now();
        if(now - lastTap < 320){
          const id = shortEl.dataset.short;
          const s = shorts.find(sh=>sh.id===id);
          if(s && !s.liked) setShortLiked(id, true);
          spawnHeartBurst(shortEl);
          lastTap = 0;
        } else {
          lastTap = now;
        }
      });

      // Swipe on the left side of the screen to toggle sound — a quick
      // one-handed alternative to tapping the small mute button, without
      // interfering with the vertical swipe used to move between Shorts.
      let touchStartX=null, touchStartY=null, touchStartedOnLeft=false;
      shortEl.addEventListener('touchstart', (e)=>{
        if(e.target.closest('button')) return;
        const t = e.touches[0];
        const rect = shortEl.getBoundingClientRect();
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchStartedOnLeft = (t.clientX - rect.left) < rect.width/2;
      }, {passive:true});
      shortEl.addEventListener('touchend', (e)=>{
        if(touchStartX===null) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        // Mostly-horizontal drag, started on the left half, past a small
        // threshold so normal taps/scrolls don't accidentally trigger it.
        if(touchStartedOnLeft && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)*1.5){
          toggleShortSound(shortEl);
        }
        touchStartX=null; touchStartY=null;
      }, {passive:true});
    });
  }

  const openUploadShort = document.getElementById('openUploadShort');
  if(openUploadShort) openUploadShort.onclick = ()=>{ showUploadShortModal=true; showEditModal=false; render(); };

  /* ---- Stories: add + view ---- */
  const storyFileInput = document.getElementById('storyFileInput');
  const addStoryBtn = document.getElementById('addStoryBtn');
  if(addStoryBtn) addStoryBtn.onclick = (e)=>{ e.stopPropagation(); storyFileInput.value=''; storyFileInput.click(); };
  if(storyFileInput) storyFileInput.onchange = async ()=>{
    const file = storyFileInput.files[0];
    if(!file) return;
    if(file.size > MAX_MEDIA_MB*1024*1024){
      alert(`That file is over ${MAX_MEDIA_MB}MB. Please pick something smaller.`);
      return;
    }
    const mediaType = file.type.startsWith('video') ? 'video' : 'image';
    try{
      storyUploadPct = 0; render();
      const mediaUrl = await uploadToStorage(file, pct=>{ storyUploadPct = pct; });
      const newStory = { authorId:ME.uid, name:ME.name, handle:ME.handle, photoUrl:ME.photoUrl||null, mediaUrl, mediaType, createdAt:Date.now() };
      try{
        const res = await fbPost('stories', newStory);
        stories = stories.filter(s=>s.authorId!==ME.uid); // one active story per person, newest replaces older
        stories.unshift({ ...newStory, id:res.name });
        syncStatus='online';
      }catch(err){
        console.error('Story upload failed to save:', err);
        stories.unshift({ ...newStory, id:'local-story-'+Date.now() });
        syncStatus='offline';
      }
      storyUploadPct = null;
      render();
    }catch(err){
      console.error(err);
      storyUploadPct = null;
      alert('Story upload failed: '+err.message);
      render();
    }
  };
  const myStoryRing = document.getElementById('myStoryRing');
  if(myStoryRing) myStoryRing.onclick = (e)=>{
    if(e.target.closest('#addStoryBtn')) return; // the + button handles itself
    const mine = myActiveStory();
    if(mine){ showStoryViewer = mine; render(); }
  };
  document.querySelectorAll('[data-view-story]').forEach(el=>el.onclick=()=>{
    const s = stories.find(st=>st.id===el.dataset.viewStory);
    if(s){ showStoryViewer = s; render(); }
  });
  const closeStoryViewer = document.getElementById('closeStoryViewer');
  if(closeStoryViewer) closeStoryViewer.onclick = ()=>{ showStoryViewer=null; render(); };
  const storyModalBack = document.getElementById('storyModalBack');
  if(storyModalBack) storyModalBack.onclick = (e)=>{ if(e.target.id==='storyModalBack'){ showStoryViewer=null; render(); } };

  const shortFileInput = document.getElementById('shortFileInput');
  const pickShortFile = document.getElementById('pickShortFile');
  if(pickShortFile) pickShortFile.onclick = ()=> shortFileInput.click();
  if(shortFileInput) shortFileInput.onchange = ()=>{
    const file = shortFileInput.files[0];
    if(!file) return;
    if(!file.type.startsWith('video')){ alert('Please choose a video file.'); return; }
    if(file.size > MAX_MEDIA_MB*1024*1024){
      alert(`That file is over ${MAX_MEDIA_MB}MB. Please pick something smaller.`);
      shortFileInput.value = '';
      return;
    }
    const url = URL.createObjectURL(file);
    // Probe the video's duration before accepting it — Shorts are capped at 3 minutes.
    const probe = document.createElement('video');
    probe.preload = 'metadata';
    probe.onloadedmetadata = ()=>{
      if(probe.duration && probe.duration > MAX_SHORT_SECONDS){
        alert(`Shorts must be ${Math.round(MAX_SHORT_SECONDS/60)} minutes or under. That video is about ${Math.ceil(probe.duration/60)} min long — trim it and try again.`);
        URL.revokeObjectURL(url);
        shortFileInput.value = '';
        return;
      }
      pendingShortFile = { file, previewUrl:url };
      render();
    };
    probe.onerror = ()=>{
      // Couldn't read duration (unusual format) — let it through, the upload step will surface any real problem.
      pendingShortFile = { file, previewUrl:url };
      render();
    };
    probe.src = url;
  };
  const shortCaptionEl = document.getElementById('shortCaption');
  if(shortCaptionEl) shortCaptionEl.oninput = ()=>{ shortCaptionDraft = shortCaptionEl.value; };
  const removeShortFile = document.getElementById('removeShortFile');
  if(removeShortFile) removeShortFile.onclick = ()=>{ pendingShortFile=null; render(); };
  const cancelUploadShort = document.getElementById('cancelUploadShort');
  if(cancelUploadShort) cancelUploadShort.onclick = ()=>{ showUploadShortModal=false; pendingShortFile=null; shortCaptionDraft=''; shortDownloadableDraft=false; render(); };
  const shortModalBack = document.getElementById('shortModalBack');
  if(shortModalBack) shortModalBack.onclick = (e)=>{ if(e.target.id==='shortModalBack'){ showUploadShortModal=false; pendingShortFile=null; shortCaptionDraft=''; shortDownloadableDraft=false; render(); } };

  const saveUploadShort = document.getElementById('saveUploadShort');
  if(saveUploadShort) saveUploadShort.onclick = async ()=>{
    if(!pendingShortFile) return;
    const caption = (shortCaptionEl?.value || '').trim();
    const downloadable = !!document.getElementById('shortDownloadableToggle')?.checked;
    try{
      shortUploadPct = 0; render();
      const src = await uploadToStorage(pendingShortFile.file, pct=>{
        shortUploadPct = pct;
        const bar = document.querySelector('#shortModalBack .upload-progress-bar');
        const lbl = document.querySelector('#shortModalBack .upload-label');
        if(bar) bar.style.width = pct+'%';
        if(lbl) lbl.textContent = 'Uploading… '+pct+'%';
      });
      const newShort = { author:ME.name, handle:ME.handle, authorId:ME.uid, photoUrl:ME.photoUrl||null, caption, src, likes:0, createdAt:Date.now(), downloadable };
      let savedShortId = null;
      try{
        const res = await fbPost('shorts', newShort);
        savedShortId = res.name;
        shorts.unshift({ ...newShort, id:res.name, comments:[] });
        syncStatus='online';
      }catch(err){
        console.error(err);
        shorts.unshift({ ...newShort, id:'local-short-'+Date.now(), comments:[] });
        syncStatus='offline';
      }

      // Automatically cross-post every uploaded Short/video to the normal Posts feed.
      // The same Cloudinary URL is reused, so the video is uploaded only once.
      const autoPost = {
        author:ME.name,
        handle:ME.handle,
        authorId:ME.uid,
        photoUrl:ME.photoUrl||null,
        createdAt:Date.now(),
        text:caption,
        mediaUrl:src,
        mediaType:'video',
        likes:0,
        downloadable,
        autoFromShort:true,
        shortId:savedShortId || null
      };
      try{
        const postRes = await fbPost('posts', autoPost);
        posts.unshift({ ...autoPost, id:postRes.name, liked:false, comments:[] });
        syncStatus='online';
      }catch(err){
        console.error('Auto post failed:', err);
        posts.unshift({ ...autoPost, id:'local-auto-post-'+Date.now(), liked:false, comments:[] });
        syncStatus='offline';
      }

      showUploadShortModal=false; pendingShortFile=null; shortCaptionDraft=''; shortUploadPct=null; shortDownloadableDraft=false;
      render();
    }catch(err){
      console.error(err);
      shortUploadPct=null;
      alert('Upload failed: '+err.message);
      render();
    }
  };

  document.querySelectorAll('[data-follow-uid]').forEach(b=>b.onclick=async (e)=>{
    e.stopPropagation();
    await toggleFollow(b.dataset.followUid);
    render();
  });

  document.querySelectorAll('[data-open-thread]').forEach(el=>el.onclick=()=>{
    openConversation(el.dataset.openThread);
  });

  document.querySelectorAll('[data-message-uid]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    openConversation(b.dataset.messageUid);
  });

  document.querySelectorAll('[data-voice-call]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    if(b.dataset.voiceCall) startCall([b.dataset.voiceCall], 'voice');
  });
  document.querySelectorAll('[data-video-call]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    if(b.dataset.videoCall) startCall([b.dataset.videoCall], 'video');
  });
  const openCallPicker = document.getElementById('openCallPicker');
  if(openCallPicker) openCallPicker.onclick = ()=>{ showCallPicker=true; showEditModal=false; showUploadShortModal=false; callPickerSelected={}; callPickerQuery=''; render(); };

  const convoBack = document.querySelector('[data-convo-back]');
  if(convoBack) convoBack.onclick = async ()=>{
    activeConversationUid = null;
    view = 'messages';
    await loadThreads();
    render();
  };

  const convoInput = document.getElementById('convoInput');
  const convoSend = document.getElementById('convoSend');
  if(convoInput && convoSend){
    scrollConvoToBottom();
    const doSend = ()=>{
      const text = convoInput.value;
      if(!text.trim()) return;
      convoInput.value = '';
      sendMessage(activeConversationUid, text);
    };
    convoSend.onclick = doSend;
    convoInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doSend(); } };
    convoInput.focus();
  }

  // Double-tap (or double-click) a message bubble to bring up delete options.
  // Uses manual tap-timing rather than the native dblclick event so it's
  // consistent between touch and mouse input.
  document.querySelectorAll('[data-msg-bubble]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.msgId;
    const now = Date.now();
    if(lastBubbleTap.id===id && (now-lastBubbleTap.time)<350){
      lastBubbleTap = { id:null, time:0 };
      openMessageActions(id);
    }else{
      lastBubbleTap = { id, time:now };
    }
  });

  document.querySelectorAll('[data-open-creator]').forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('[data-follow-uid]')) return; // follow button handles itself
    openCreatorProfile(el.dataset.openCreator);
  });

  const profileSearchInput = document.getElementById('profileSearchInput');
  if(profileSearchInput){
    profileSearchInput.focus();
    const pos = profileSearchInput.value.length;
    profileSearchInput.setSelectionRange(pos,pos);
    profileSearchInput.oninput = ()=>{ exploreQuery = profileSearchInput.value; render(); };
  }

  const openEdit = document.getElementById('openEdit');
  if(openEdit) openEdit.onclick = ()=>{ showEditModal=true; showUploadShortModal=false; render(); };
  const openEditPhoto = document.getElementById('openEditPhoto');
  if(openEditPhoto) openEditPhoto.onclick = ()=>{ showEditModal=true; showUploadShortModal=false; render(); setTimeout(()=>document.getElementById('changePhotoBtn')?.click(),0); };
  const cancelEdit = document.getElementById('cancelEdit');
  if(cancelEdit) cancelEdit.onclick = ()=>{ showEditModal=false; render(); };

  const changePhotoBtn = document.getElementById('changePhotoBtn');
  const photoInput = document.getElementById('photoInput');
  if(changePhotoBtn) changePhotoBtn.onclick = ()=> photoInput.click();
  if(photoInput) photoInput.onchange = async ()=>{
    const file = photoInput.files[0];
    if(!file) return;
    if(file.size > MAX_MEDIA_MB*1024*1024){
      alert(`That file is over ${MAX_MEDIA_MB}MB. Please pick something smaller.`);
      return;
    }
    try{
      photoUploadPct = 0; render();
      const url = await uploadToStorage(file, pct=>{ photoUploadPct = pct; const b=document.getElementById('changePhotoBtn'); if(b) b.textContent = `Uploading… ${pct}%`; });
      ME.photoUrl = url;
      photoUploadPct = null;
      render();
      try{ await fbPatch(`users/${ME.uid}`, { photoUrl: ME.photoUrl }); syncStatus='online'; }
      catch(err){ console.error(err); syncStatus='offline'; }
    }catch(err){
      console.error(err);
      photoUploadPct = null;
      alert('Photo upload failed: '+err.message);
      render();
    }
  };
  const saveEdit = document.getElementById('saveEdit');
  if(saveEdit) saveEdit.onclick = async ()=>{
    ME.name = document.getElementById('editName').value.trim() || ME.name;
    ME.bio = document.getElementById('editBio').value.trim();
    showEditModal = false;
    render();
    try{ await fbPatch(`users/${ME.uid}`, { name: ME.name, bio: ME.bio }); syncStatus='online'; }
    catch(err){ console.error(err); syncStatus='offline'; }
    render();
  };
  const modalBack = document.getElementById('modalBack');
  if(modalBack) modalBack.onclick = (e)=>{ if(e.target.id==='modalBack'){ showEditModal=false; render(); } };

  const doSignOut = async ()=>{ try{ await auth.signOut(); }catch(err){ console.error('Sign-out failed:', err); } };
  const signOutBtn = document.getElementById('signOutBtn');
  if(signOutBtn) signOutBtn.onclick = doSignOut;
  const signOutBtnProfile = document.getElementById('signOutBtnProfile');
  if(signOutBtnProfile) signOutBtnProfile.onclick = doSignOut;
  const openSettingsBtn = document.getElementById('openSettingsBtn');
  if(openSettingsBtn) openSettingsBtn.onclick = ()=>{ showSettingsModal=true; render(); };

  document.querySelectorAll('[data-profile-tab]').forEach(b=>b.onclick=async ()=>{
    profileTab=b.dataset.profileTab;
    render();
    if(profileTab==='following' || profileTab==='followers'){
      // These lists depend on every account's up-to-date followingIds, which
      // only lived in memory from the last periodic sync. Refetch on demand
      // so a just-made follow (by you or by someone else) always shows up
      // immediately instead of waiting up to 7s for the background poll.
      try{
        await refreshMyCounts();
        await loadUsersDirectory();
      }catch(err){ console.error('Could not refresh follow lists:', err); }
      render();
    }
  });

  document.querySelectorAll('[data-delete-short]').forEach(b=>b.onclick=async (e)=>{
    e.stopPropagation();
    await deleteMyShort(b.dataset.deleteShort);
  });
}

let syncTimer = null;

function startBackgroundSync(){
  if(syncTimer) return;
  // pull latest from Firebase periodically, but never while someone is
  // mid-typing or has a modal open, so we don't yank their input away
  syncTimer = setInterval(async ()=>{
    const active = document.activeElement;
    const isTyping = active && (active.tagName==='TEXTAREA' || active.tagName==='INPUT');
    // Never silently rebuild the DOM while someone is on the Shorts tab —
    // that used to tear down and re-mount every video mid-scroll, which is
    // what made the creator's profile bar/overlay flash and disappear.
    if(isTyping || showEditModal || showSettingsModal || showUploadShortModal || showStoryViewer || view==='shorts') return;
    await loadFromFirebase(true);
    if(view==='conversation' && activeConversationUid) await loadConversation(activeConversationUid);
    render();
  }, 7000);
}

function stopBackgroundSync(){
  if(syncTimer){ clearInterval(syncTimer); syncTimer = null; }
}

function firebaseLoadErrorScreen(){
  return `<div class="signin-screen">
    <div class="signin-card">
      <h1 class="brand" style="font-size:22px;margin-bottom:10px;">Couldn't load sign-in</h1>
      <p style="color:var(--ink-soft);font-size:13.5px;line-height:1.5;">
        The Google sign-in script didn't load. This usually means an ad blocker,
        privacy extension, or network/firewall is blocking <b>www.gstatic.com</b>.
        Try disabling blockers for this page, switching networks, or opening it
        in a different browser, then reload.
      </p>
    </div>
  </div>`;
}

if(firebaseInitError || !auth){
  document.getElementById('app').innerHTML = firebaseLoadErrorScreen();
}else{
  auth.onAuthStateChanged(async (user)=>{
    stopBackgroundSync();
    stopIncomingCallPolling();
    if(activeCall) endCall(false);
    if(!user){
      ME = null;
      phoneStep = 'input';
      phoneConfirmation = null;
      phoneNumberValue = '';
      document.getElementById('app').innerHTML = signInScreen();
      document.getElementById('mobileNav').innerHTML = '';
      document.getElementById('modalRoot').innerHTML = '';
      document.getElementById('callRoot').innerHTML = '';
      bindSignIn();
      return;
    }
    document.getElementById('app').innerHTML = accountSetupLoadingScreen();
    const ok = await ensureUserProfile(user);
    if(!ok){
      document.getElementById('app').innerHTML = bannedAccountScreen();
      try{ await auth.signOut(); }catch(err){ console.error(err); }
      return;
    }
    await loadFromFirebase();
    if(justSignedUp){ view='explore'; justSignedUp=false; }
    render();
    startBackgroundSync();
    startIncomingCallPolling();
  });
}

function bannedAccountScreen(){
  return `<div class="signin-screen"><div class="signin-card">
    <h1 class="brand" style="font-size:22px;margin-bottom:10px;">Account suspended</h1>
    <p style="color:var(--ink-soft);font-size:13.5px;line-height:1.5;">
      This account was suspended after repeated reports of content that violates
      our guidelines. If you believe this is a mistake, contact support.
    </p>
  </div></div>`;
}
