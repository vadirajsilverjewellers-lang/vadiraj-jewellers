<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vamshi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F1;
    --paper-raised:#FFFFFF;
    --ink:#231A33;
    --ink-soft:#6E6579;
    --line:#E6E0D2;
    --gold:#AD8422;
    --gold-soft:#F1E6C8;
    --berry:#A23F55;
    --berry-soft:#F3DEE2;
    --sidebar-w:240px;
    --panel-w:320px;
    --radius:3px;
  }
  html.dark{
    --paper:#1C1626;
    --paper-raised:#241D31;
    --ink:#F3EEE3;
    --ink-soft:#B1A7BE;
    --line:#3A314B;
    --gold:#D9B04C;
    --gold-soft:#3A3122;
    --berry:#D97C90;
    --berry-soft:#3A222A;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  body,input,textarea,button{
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
  }
  body{
    background:var(--paper);
    transition:background .25s ease, color .25s ease;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
  }
  a{color:inherit;text-decoration:none;}
  button{cursor:pointer;font:inherit;}
  ::selection{background:var(--gold-soft);}
  svg{width:20px;height:20px;flex:none;}

  /* ---------- APP SHELL ---------- */
  .app{
    max-width:1180px;
    margin:0 auto;
    display:grid;
    grid-template-columns:var(--sidebar-w) minmax(0,1fr) var(--panel-w);
    min-height:100vh;
  }
  /* ---------- SIDEBAR ---------- */
  .sidebar{
    border-right:1px solid var(--line);
    padding:28px 18px;
    position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column;
  }
  .logo{
    font-size:26px;
    letter-spacing:.2px;
    margin:0 8px 34px;
  }
  .logo em{font-style:italic; color:var(--gold);}
  .navlist{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:2px;}
  .navlist button{
    width:100%;
    display:flex; align-items:center; gap:14px;
    background:none; border:none;
    padding:11px 10px;
    border-radius:var(--radius);
    font-size:15.5px;
    text-align:left;
    color:var(--ink-soft);
  }
  .navlist button svg{width:21px;height:21px;flex:none;}
  .navlist button .lbl{display:inline;}
  .navlist button.active{ color:var(--ink); font-weight:600; }
  .navlist button.active svg{ stroke:var(--berry); }
  .navlist button:hover{background:var(--paper-raised);}
  .compose-btn{
    margin-top:22px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:999px;
    padding:13px 0;
    font-weight:600;
    font-size:15px;
  }
  html.dark .compose-btn{background:var(--gold); color:#1C1626;}
  .compose-btn:hover{opacity:.88;}
  .sidebar-foot{margin-top:auto; padding-top:18px;}
  .theme-toggle{
    display:flex; align-items:center; justify-content:center; gap:10px;
    border:1px solid var(--line); border-radius:999px;
    padding:8px 12px; background:var(--paper-raised);
    font-size:13.5px; color:var(--ink-soft); width:100%;
    white-space:nowrap; overflow:hidden;
  }

  /* ---------- MAIN COLUMN ---------- */
  .main{border-right:1px solid var(--line); min-height:100vh; position:relative;}
  .topbar{
    position:sticky; top:0; z-index:5;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:16px 22px;
  }
  .topbar h1{
    font-family:'Fraunces', serif;
    font-size:20px; margin:0; font-weight:600;
  }
  .topbar p{margin:2px 0 0; font-size:13px; color:var(--ink-soft);}

  .composer{
    padding:18px 22px; border-bottom:1px solid var(--line);
    display:flex; gap:12px;
  }
  .avatar{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:600; font-size:14px; flex:none; color:#fff;
    overflow:hidden; position:relative;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
  .composer-body{flex:1;}
  .composer textarea{
    width:100%; border:none; resize:none; background:none;
    font-size:16.5px; line-height:1.45; outline:none; min-height:52px;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .composer textarea::placeholder{color:var(--ink-soft);}
  .composer-row{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
  .composer-count{font-size:12.5px; color:var(--ink-soft);}
  .composer-tools{display:flex; align-items:center; gap:10px;}
  .media-btn{
    background:none; border:1px solid var(--line); border-radius:999px;
    padding:7px 9px; color:var(--ink-soft); display:flex; align-items:center;
  }
  .media-btn:hover{color:var(--berry); border-color:var(--berry);}
  .media-preview{position:relative; margin-top:10px; max-width:320px;}
  .media-preview img, .media-preview video{width:100%; border-radius:var(--radius); border:1px solid var(--line); display:block; max-height:280px; background:#000;}
  .media-remove{
    position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; border:none; display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .upload-progress{margin-top:8px; height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .upload-progress-bar{height:100%; background:var(--berry); transition:width .15s ease;}
  .upload-label{font-size:12px; color:var(--ink-soft); margin-top:5px;}
  .post-submit{
    background:var(--berry); color:#fff; border:none;
    border-radius:999px; padding:9px 20px; font-weight:600; font-size:14px;
  }
  .post-submit:disabled{opacity:.4; cursor:default;}

  /* ---------- FEED / POSTS ---------- */
  .feed{}
  .post{
    padding:18px 22px; border-bottom:1px solid var(--line);
    display:flex; gap:12px; animation:fade .35s ease;
  }
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .post-main{flex:1; min-width:0;}
  .post-head{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;}
  .post-head .name{font-weight:600; font-size:15px;}
  .post-head .handle, .post-head .dot, .post-head .time{color:var(--ink-soft); font-size:13.5px;}
  .post-text{margin:5px 0 10px; font-size:15.5px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word;}
  .post-media{border-radius:var(--radius); margin-bottom:10px; overflow:hidden; border:1px solid var(--line); background:#000;}
  .post-media img, .post-media video{width:100%; max-height:520px; display:block; object-fit:contain; background:#000;}
  .post-actions{display:flex; gap:26px;}
  .act{
    display:flex; align-items:center; gap:7px;
    background:none; border:none; color:var(--ink-soft); font-size:13.5px;
  }
  .act svg{width:18px;height:18px;}
  .act:hover{color:var(--ink);}
  .act.liked{color:var(--berry);}
  .act.liked svg{fill:var(--berry); stroke:var(--berry);}

  .comments{margin-top:12px; border-top:1px dashed var(--line); padding-top:12px; display:flex; flex-direction:column; gap:10px;}
  .comment{display:flex; gap:9px; font-size:14px;}
  .comment .name{font-weight:600; margin-right:6px;}
  .comment-form{display:flex; gap:9px; align-items:center; margin-top:2px;}
  .comment-form input{
    flex:1; border:1px solid var(--line); border-radius:999px;
    padding:8px 14px; font-size:13.5px; background:var(--paper-raised); outline:none;
  }
  .comment-form button{background:none; border:none; color:var(--berry); font-weight:600; font-size:13.5px;}

  /* ---------- SHORTS COMMENTS SHEET ---------- */
  .short-comments-sheet{
    background:var(--paper-raised); width:100%; max-width:460px; margin:0 auto;
    border-radius:16px 16px 0 0; max-height:72vh; display:flex; flex-direction:column;
    border:1px solid var(--line); border-bottom:none; animation:sheetUp .2s ease;
  }
  @keyframes sheetUp{from{transform:translateY(16px); opacity:.4;} to{transform:none; opacity:1;}}
  .short-comments-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--line); flex:none;
  }
  .short-comments-head h3{margin:0; font-family:'Fraunces', serif; font-size:17px;}
  .short-comments-list{overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px; flex:1;}
  .short-comments-sheet .comment-form{border-top:1px solid var(--line); padding:12px 16px; margin:0; flex:none;}

  /* ---------- RIGHT PANEL ---------- */
  .panel{padding:26px 20px; display:flex; flex-direction:column; gap:26px;}
  .card{border:1px solid var(--line); border-radius:var(--radius); padding:18px; background:var(--paper-raised);}
  .profile-card .avatar{width:52px;height:52px;font-size:17px;margin-bottom:10px;}
  .profile-card h3{margin:0 0 2px; font-family:'Fraunces', serif; font-size:18px;}
  .profile-card p{margin:0 0 12px; font-size:13.5px; color:var(--ink-soft);}
  .stat-row{display:flex; gap:18px; font-size:13px;}
  .stat-row b{display:block; font-size:15px;}
  .card h4{margin:0 0 12px; font-size:13.5px; text-transform:none; letter-spacing:.2px; color:var(--ink-soft); font-weight:600;}
  .suggest-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .suggest-row .avatar{width:34px;height:34px;font-size:12px;}
  .suggest-row .who{flex:1; min-width:0;}
  .suggest-row .who .n{font-size:13.5px; font-weight:600;}
  .suggest-row .who .h{font-size:12px; color:var(--ink-soft);}
  .follow-btn{border:1px solid var(--ink); background:none; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600;}
  .follow-btn.following{background:var(--ink); color:var(--paper);}
  .trend{padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .trend:last-child{border:none;}
  .trend .tag{font-weight:600; display:block;}
  .trend .n{color:var(--ink-soft); font-size:12px;}

  /* ---------- VIEWS: PROFILE / EXPLORE / NOTIFS / MESSAGES ---------- */
  .profile-banner{height:120px; background:linear-gradient(120deg, var(--gold-soft), var(--berry-soft));}
  .profile-head{padding:0 22px 18px; margin-top:-34px;}
  .profile-head .avatar{width:84px;height:84px; font-size:26px; border:4px solid var(--paper); margin-bottom:10px;}
  .profile-head h2{font-family:'Fraunces', serif; margin:0 0 2px; font-size:23px;}
  .profile-head .handle{color:var(--ink-soft); font-size:14px;}
  .profile-head .bio{margin:12px 0; font-size:14.5px; line-height:1.5; max-width:480px;}
  .profile-stats{display:flex; gap:20px; font-size:13.5px; margin-bottom:14px;}
  .profile-stats b{color:var(--ink);}
  .edit-btn{border:1px solid var(--line); background:var(--paper-raised); border-radius:999px; padding:8px 16px; font-size:13.5px; font-weight:600;}
  .sign-out-btn{
    position:absolute; top:12px; right:14px;
    display:flex; align-items:center; gap:6px;
    background:rgba(0,0,0,.35); color:#fff; border:1px solid rgba(255,255,255,.6);
    border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:600;
    backdrop-filter:blur(4px);
  }
  .sign-out-btn svg{width:14px;height:14px;stroke:#fff;}
  .sign-out-btn:hover{background:rgba(0,0,0,.55);}

  .grid-simple{padding:20px 22px; display:grid; gap:14px;}
  .explore-card{border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .explore-card .tag{font-family:'Fraunces', serif; font-size:17px; margin:0 0 4px;}
  .explore-card p{margin:0; font-size:13px; color:var(--ink-soft);}

  .notif{display:flex; gap:12px; padding:15px 22px; border-bottom:1px solid var(--line); align-items:flex-start;}
  .notif svg{width:20px;height:20px; flex:none; margin-top:2px; stroke:var(--berry);}
  .notif .t{font-size:14.5px;}
  .notif .time{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .notif.unread{background:var(--line);}
  .notif .n-avatar{position:relative; flex:none;}
  .notif .n-badge{position:absolute; right:-3px; bottom:-3px; width:18px;height:18px; border-radius:50%; background:var(--paper); display:flex; align-items:center; justify-content:center;}
  .notif .n-badge svg{width:11px;height:11px; margin:0; stroke:var(--gold);}

  .msg-thread{display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); cursor:pointer;}
  .msg-thread:hover{background:var(--line);}
  .msg-thread .who{flex:1; min-width:0;}
  .msg-thread .n{font-weight:600; font-size:14.5px;}
  .msg-thread .preview{font-size:13px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .msg-thread .time{font-size:11.5px; color:var(--ink-soft); flex:none;}

  .navlist button{position:relative;}
  .nav-badge{position:absolute; top:2px; left:18px; width:8px;height:8px; border-radius:50%; background:var(--berry);}
  .mobile-nav button{position:relative;}
  .mobile-nav .nav-badge{top:2px; right:8px; left:auto;}

  .convo-wrap{display:flex; flex-direction:column; min-height:70vh;}
  .convo-head{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line);}
  .convo-head button{background:none;border:none;cursor:pointer;color:var(--ink);padding:4px;display:flex;}
  .convo-head svg{width:22px;height:22px;}
  .convo-head .n{font-weight:600; font-size:15px;}
  .convo-head .h{font-size:12.5px; color:var(--ink-soft);}
  .convo-msgs{flex:1; max-height:55vh; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:8px;}
  .convo-bubble{max-width:72%; padding:9px 13px; border-radius:16px; font-size:14px; line-height:1.4; word-wrap:break-word;}
  .convo-bubble.mine{align-self:flex-end; background:var(--ink); color:var(--paper); border-bottom-right-radius:4px;}
  .convo-bubble.theirs{align-self:flex-start; background:var(--line); color:var(--ink); border-bottom-left-radius:4px;}
  .convo-bubble{cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none;}
  .convo-bubble.deleted{font-style:italic; opacity:.6; cursor:default;}
  .convo-bubble.mine.deleted{background:var(--line); color:var(--ink-soft);}
  .msg-action-sheet{
    background:var(--paper-raised); width:100%; max-width:460px; margin:0 auto;
    border-radius:16px 16px 0 0; display:flex; flex-direction:column;
    border:1px solid var(--line); border-bottom:none; animation:sheetUp .2s ease;
    padding:8px 0 4px;
  }
  .msg-action-sheet button{
    background:none; border:none; text-align:left; padding:14px 20px; font-size:15px;
    color:var(--ink); cursor:pointer; border-bottom:1px solid var(--line);
  }
  .msg-action-sheet button:last-child{border-bottom:none;}
  .msg-action-sheet button.danger{color:var(--berry);}
  .msg-action-sheet button:hover{background:var(--line);}
  .convo-empty{margin:auto; text-align:center; color:var(--ink-soft); font-size:13.5px;}
  .convo-input{display:flex; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--line);}
  .convo-input input{flex:1; border:1px solid var(--line); border-radius:20px; padding:10px 16px; font-size:14px; background:var(--paper); color:var(--ink);}
  .convo-input button{flex:none; width:38px;height:38px; border-radius:50%; border:none; background:var(--ink); color:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .convo-input button svg{width:17px;height:17px;}
  .convo-input button:disabled{opacity:0.4; cursor:default;}
  .message-btn{margin-top:2px; margin-left:8px; padding:9px 18px; border-radius:20px; border:1px solid var(--line); background:none; color:var(--ink); font-size:13.5px; cursor:pointer;}
  .call-btn{margin-top:2px; margin-left:8px; padding:9px; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:none; color:var(--ink); display:inline-flex; align-items:center; justify-content:center; cursor:pointer;}
  .call-btn svg{width:17px;height:17px;}
  .convo-head .call-btn{margin-left:auto; margin-top:0;}
  .convo-head .call-btn + .call-btn{margin-left:8px;}
  .msg-topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 22px 0;}
  .msg-topbar button{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;cursor:pointer;}
  .msg-topbar button svg{width:15px;height:15px;}

  /* ---------- DOWNLOAD BUTTONS ---------- */
  .short-rail a[data-download], .short-rail button[data-download]{color:#fff; text-decoration:none;}
  .post-actions a[data-download]{color:var(--ink-soft); text-decoration:none; display:inline-flex; align-items:center; gap:6px; background:none; border:none; font-size:13.5px; cursor:pointer;}
  .dl-toggle-row{display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius);}
  .dl-toggle-row .lbl{font-size:13.5px;}
  .dl-toggle-row .sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .switch{position:relative; display:inline-block; width:42px; height:24px; flex:none;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .slider{position:absolute; cursor:pointer; inset:0; background:var(--line); border-radius:999px; transition:.15s;}
  .switch .slider::before{content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.15s;}
  .switch input:checked + .slider{background:var(--berry);}
  .switch input:checked + .slider::before{transform:translateX(18px);}

  /* ---------- VOICE / VIDEO CALLS ---------- */
  .incoming-call-banner{position:fixed; inset:0; z-index:1000; background:rgba(15,11,20,.92); display:flex; align-items:center; justify-content:center; padding:20px;}
  .incoming-call-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:20px; padding:32px 26px; text-align:center; width:100%; max-width:340px;}
  .incoming-call-card .avatar{margin:0 auto 14px; width:84px; height:84px; font-size:28px;}
  .incoming-call-card h3{margin:0 0 4px; font-family:'Fraunces', serif;}
  .incoming-call-card p{margin:0 0 24px; color:var(--ink-soft); font-size:13.5px;}
  .incoming-call-actions{display:flex; gap:16px; justify-content:center;}
  .incoming-call-actions button{width:58px; height:58px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .incoming-call-actions button svg{width:22px;height:22px;}
  .call-accept{background:#3FA65C; color:#fff;}
  .call-decline{background:var(--berry); color:#fff;}
  .call-overlay{position:fixed; inset:0; z-index:1000; background:#0F0B14; display:flex; flex-direction:column;}
  .call-overlay-head{padding:16px 20px; color:#fff; text-align:center; flex:none;}
  .call-overlay-head .status{font-size:12.5px; color:#B1A7BE;}
  .call-overlay-head .title{font-family:'Fraunces', serif; font-size:18px;}
  .call-grid{flex:1; display:grid; gap:6px; padding:6px; overflow:auto; align-content:center; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}
  .call-tile{position:relative; background:#1C1626; border-radius:12px; overflow:hidden; aspect-ratio:3/4; display:flex; align-items:center; justify-content:center;}
  .call-tile video{width:100%; height:100%; object-fit:cover; display:block;}
  .call-tile video.voice-hidden{display:none;}
  .call-tile .tile-name{position:absolute; left:8px; bottom:8px; color:#fff; font-size:12px; background:rgba(0,0,0,.45); padding:3px 9px; border-radius:999px;}
  .call-tile.local video{transform:scaleX(-1);}
  .call-controls{flex:none; display:flex; justify-content:center; gap:16px; padding:20px 20px 30px;}
  .call-controls button{width:54px; height:54px; border-radius:50%; border:none; background:#2A2237; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .call-controls button svg{width:20px;height:20px;}
  .call-controls button.active-off{background:#fff; color:#0F0B14;}
  .call-controls button.end-call{background:var(--berry);}
  @media (max-width:640px){ .call-grid{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));} }

  .empty{padding:60px 22px; text-align:center; color:var(--ink-soft);}
  .empty .brand{display:block; font-size:20px; color:var(--ink); margin-bottom:6px;}

  /* ---------- STORIES BAR (Instagram-style) ---------- */
  .stories{display:flex; gap:16px; padding:16px 22px; border-bottom:1px solid var(--line); overflow-x:auto;}
  .story{display:flex; flex-direction:column; align-items:center; gap:6px; flex:none; width:64px;}
  .story-ring{width:60px;height:60px;border-radius:50%; padding:2.5px; background:linear-gradient(135deg,var(--gold),var(--berry));}
  .story-ring.seen{background:var(--line);}
  .story-ring .avatar{width:100%;height:100%; border:2.5px solid var(--paper); font-size:15px;}

/*
 * Media is NOT stored in Firebase Storage.
 * Cloudinary stores the image/video files and Firebase only stores the returned URL.
 *
 * IMPORTANT: create an UNSIGNED upload preset in your Cloudinary account and put
 * your Cloud Name + preset below. Never put a Cloudinary API Secret in this file.
 */
const CLOUDINARY_CLOUD_NAME = 'uv3ua3b7';
const CLOUDINARY_UPLOAD_PRESET = 'Vamshi';
const MAX_MEDIA_MB = 100;
const MAX_SHORT_SECONDS = 180; // 3 minutes

function uploadToStorage(file, onProgress){
  return new Promise((resolve, reject)=>{
    if(!CLOUDINARY_CLOUD_NAME || CLOUDINARY_CLOUD_NAME === 'YOUR_CLOUD_NAME'){
      reject(new Error('Cloudinary is not configured. Set CLOUDINARY_CLOUD_NAME in the HTML file.'));
      return;
    }
    if(!CLOUDINARY_UPLOAD_PRESET || CLOUDINARY_UPLOAD_PRESET === 'YOUR_UNSIGNED_UPLOAD_PRESET'){
      reject(new Error('Cloudinary is not configured. Set an unsigned CLOUDINARY_UPLOAD_PRESET in the HTML file.'));
      return;
    }

    const resourceType = file.type && file.type.startsWith('video/') ? 'video' : 'image';
    const url = `https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUDINARY_CLOUD_NAME)}/${resourceType}/upload`;
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    form.append('folder', `${DATA_ROOT}/media`);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.upload.onprogress = e => {
      if(e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100));
    };
    xhr.onload = () => {
      let res = null;
      try{ res = JSON.parse(xhr.responseText || '{}'); }catch(e){}
      if(xhr.status>=200 && xhr.status<300 && res && res.secure_url){
        resolve(res.secure_url);
      }else{
        const message = res?.error?.message || `Cloudinary upload failed (${xhr.status})`;
        reject(new Error(message));
      }
    };
    xhr.onerror = () => reject(new Error('Network error reaching Cloudinary. Check your internet connection and Cloudinary upload preset.'));
    xhr.onabort = () => reject(new Error('Upload cancelled.'));
    xhr.send(form);
  });
}

function timeAgo(ts){
  if(!ts) return 'now';
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<45) return 'now';
  if(s<3600) return Math.floor(s/60)+'m';
  if(s<86400) return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}

// Loads this Google account's profile from Firebase, creating one on first sign-in.
// Returns false (and signs the user back out) if the account is banned.
async function ensureUserProfile(user){
  let saved = null;
  try{ saved = await fbGet(`users/${user.uid}`); }
  catch(err){ console.error('Could not load profile:', err); }
  if(!saved){
    saved = blankProfile(user);
    justSignedUp = true;
    let created = false;
    // Try twice: right after a fresh sign-in, auth.currentUser's ID token can
    // occasionally lag a beat behind onAuthStateChanged firing, which makes
    // the very first write get rejected. A short retry covers that without
    // making the person re-open the app.
    for(let attempt=0; attempt<2 && !created; attempt++){
      try{
        await fbPut(`users/${user.uid}`, saved);
        created = true;
      }catch(err){
        console.error(`Could not create profile (attempt ${attempt+1}):`, err);
        if(attempt===0) await new Promise(r=>setTimeout(r, 800));
      }
    }
    if(!created){
      // Don't pretend this worked — without a real Firebase record, no one
      // else's Explore/Suggested list will ever show this account, and this
      // same silent failure would just repeat on every future sign-in.
      syncStatus = 'offline';
      alert('Your profile could not be saved to the server. You can keep using the app on this device, but other people won\'t be able to see your account yet — please check your connection and reload.');
    }
  }
  if(saved.banned){
    return false;
  }
  ME = {
    uid: user.uid,
    name: saved.name || user.displayName || 'New user',
    handle: saved.handle || ('@'+user.uid.slice(0,8)),
    bio: saved.bio || '',
    followers: saved.followers || 0,
    following: saved.following || 0,
    photoUrl: saved.photoUrl || user.photoURL || null,
    followingIds: saved.followingIds || {},
    strikes: saved.strikes || 0,
    ringtone: saved.ringtone || 'classic',
  };
  return true;
}

// Pulls every registered profile from Firebase so Explore's profile search
// and the "Suggested for you" rail show real accounts instead of demo ones.
async function loadUsersDirectory(){
  try{
    const raw = await fbGet('users') || {};

    // Followers are derived from the real followingIds of every account.
    // This means User B immediately gets a follower when User A follows B,
    // without trying to write into User B's Firebase profile (which can be
    // blocked by normal Firebase security rules).
    followerCounts = {};
    Object.entries(raw).forEach(([uid,u])=>{
      const followingIds = (u && u.followingIds) || {};
      Object.keys(followingIds).forEach(targetUid=>{
        if(targetUid && followingIds[targetUid] === true){
          followerCounts[targetUid] = (followerCounts[targetUid]||0) + 1;

      .map(([uid,u])=>({

        name:u?.name || 'Someone',
        handle:u?.handle || ('@'+uid.slice(0,8)),
        photoUrl:u?.photoUrl || null,
        following: !!(ME.followingIds && ME.followingIds[uid]),
        followingIds: u?.followingIds || {},
        followers: followerCounts[uid] || 0,
        followingCount: Object.keys(u?.followingIds || {}).length
      }));

    suggestions = allUsers.slice(0,5);
    ME.followers = followerCounts[ME.uid] || 0;

async function loadFromFirebase(quiet){
  if(!quiet) syncStatus='connecting';
  await seedIfEmpty();
  await purgeDemoContent();

  // Fetch independently — allSettled means one 401/network error on "shorts"
  // no longer blanks out posts that loaded just fine.
  const [postsRes, shortsRes] = await Promise.allSettled([
    fbGet('posts'), fbGet('shorts')
  ]);

  if(postsRes.status==='fulfilled'){
    posts = postsObjToArray(postsRes.value);
  }else{
    console.error('Posts sync failed:', postsRes.reason);
    if(posts.length===0) posts = SEED_POSTS.map((p,i)=>({id:'local-'+i, ...p, liked:false}));
  }

  if(shortsRes.status==='fulfilled'){
    shorts = shortsObjToArray(shortsRes.value).sort((a,b)=>b.createdAt-a.createdAt);
    applyViralBadges();
  }else{
    console.error('Shorts sync failed:', shortsRes.reason);
    if(shorts.length===0) shorts = SEED_SHORTS.map((s,i)=>({id:'local-short-'+i, ...s}));
  }

  // These four don't depend on each other, so fetch them concurrently instead
  // of one-by-one — this was the biggest chunk of the slow-startup chain,
  // since each was a separate network round trip taken in series.
  await Promise.allSettled([
    refreshMyCounts(),
    loadUsersDirectory(),
    loadStories(),
    loadNotifications(),
    loadThreads()
  ]);
  notifyNewActivity();

  const anyFailed = [postsRes, shortsRes].some(r=>r.status==='rejected');
  syncStatus = anyFailed ? 'offline' : 'online';
}

// A creator with 5+ Shorts uploaded is treated as a "trending creator" —
// their earliest Short gets a 🔥 badge and the whole batch is boosted to the
// top of the feed, newest trending creators first.
function applyViralBadges(){
  const byAuthor = {};
  shorts.forEach(s=>{ const k=s.authorId||s.handle; (byAuthor[k]=byAuthor[k]||[]).push(s); });
  shorts.forEach(s=>s.viral=false);
  Object.values(byAuthor).forEach(group=>{
    if(group.length>=5){
      const earliest = group.slice().sort((a,b)=>a.createdAt-b.createdAt)[0];
      earliest.viral = true;
    }
  });
  shorts.sort((a,b)=>{
    if(a.viral!==b.viral) return a.viral ? -1 : 1;
    return b.createdAt-a.createdAt;
  });
}

// Follow/unfollow a real account by uid, persisting to Firebase and updating
// every place that account shows up on screen (suggestions, Explore, the
// creator-profile view, and the follow button inside a Short's overlay).
async function toggleFollow(uid){
  if(!uid || uid===ME.uid) return;

  const previousIds = {...(ME.followingIds || {})};
  const wasFollowing = !!previousIds[uid];
  const nextIds = {...previousIds};

  if(wasFollowing) delete nextIds[uid];
  else nextIds[uid] = true;

  const nextFollowing = Object.keys(nextIds).length;

  // Persist first. If Firebase rejects the write, restore the old state so
  // the button/count never claims a follow that wasn't actually saved.
  try{
    await fbPatch(`users/${ME.uid}`, {
      followingIds: nextIds,
      following: nextFollowing
    });

    ME.followingIds = nextIds;
    ME.following = nextFollowing;

    const newState = !wasFollowing;
    allUsers.forEach(u=>{ if(u.uid===uid) u.following = newState; });
    suggestions.forEach(u=>{ if(u.uid===uid) u.following = newState; });
    if(viewingCreator && viewingCreator.uid===uid) viewingCreator.following = newState;
    if(newState) sendNotification(uid, { type:'follow', text:`${ME.name} started following you` });

    syncStatus='online';

    // Recalculate followers from every account's followingIds. This updates
    // the target profile's Followers number immediately on every screen.
    await loadUsersDirectory();
    if(viewingCreator && viewingCreator.uid===uid){
      const freshTarget = allUsers.find(u=>u.uid===uid);
      if(freshTarget) viewingCreator = {...freshTarget};
      viewingCreator.followers = followerCounts[uid] || 0;
    }
    // Immediately refresh the visible Follow/Followers UI.
    render();
  }catch(err){
    ME.followingIds = previousIds;
    ME.following = Object.keys(previousIds).length;
    console.error('Could not sync follow:', err);
    syncStatus='offline';
    alert('Could not update Follow right now. Please check your connection and try again.');
  }
}

/* ---------------- NOTIFICATIONS ---------------- */
// Fire-and-forget: writes one notification into the recipient's own list.
// Never notifies yourself, and a failure here should never block whatever
// action (follow/like/comment) triggered it.
async function sendNotification(toUid, data){
  if(!toUid || !ME || toUid===ME.uid) return;
  try{
    await fbPost(`notifications/${toUid}`, {
      fromUid: ME.uid,
      fromName: ME.name,
      fromHandle: ME.handle,
      fromPhoto: ME.photoUrl || null,
      read: false,
      createdAt: Date.now(),
      ...data
    });
  }catch(err){ console.error('Could not send notification:', err); }
}

async function loadNotifications(){
  if(!ME) return;
  try{
    const raw = await fbGet(`notifications/${ME.uid}`);
    notifications = Object.entries(raw||{})
      .map(([id,n])=>({id, ...n}))
      .sort((a,b)=>b.createdAt-a.createdAt);
  }catch(err){ console.error('Could not load notifications:', err); }
}

// Marks every currently-loaded notification as read, both on screen and in
// Firebase. Called when the Notifications tab is opened.
async function markNotificationsRead(){
  const unread = notifications.filter(n=>!n.read);
  if(unread.length===0) return;
  unread.forEach(n=>n.read=true);
  render();
  try{
    await Promise.all(unread.map(n=>fbPatch(`notifications/${ME.uid}/${n.id}`, { read:true })));
  }catch(err){ console.error('Could not mark notifications read:', err); }
}

// Asks the browser/OS for notification permission. Must be called from a
// direct user click (browsers block silent/auto permission prompts).
async function requestDeviceNotifications(){
  if(typeof Notification==='undefined'){
    alert('Notifications are not supported in this browser.');
    return;
  }
  if(Notification.permission==='granted'){ notifPermissionState='granted'; render(); return; }
  if(Notification.permission==='denied'){
    alert('Notifications are blocked for this site. You can re-enable them from your browser\'s site settings.');
    return;
  }
  try{
    notifPermissionState = await Notification.requestPermission();
  }catch(err){ console.error('Notification permission request failed:', err); }
  render();
}

function notifButtonLabel(){
  if(typeof Notification==='undefined') return 'Notifications unavailable';
  if(notifPermissionState==='granted') return 'Notifications on';
  if(notifPermissionState==='denied') return 'Notifications blocked';
  return 'Enable notifications';
}

// Fires a real device notification. Only when the tab isn't already focused —
// no need to buzz the phone for something already on screen.
function showDeviceNotification(title, body, tag){
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
  if(document.visibilityState==='visible') return;
  try{
    const n = new Notification(title, { body, tag, icon: ME && ME.photoUrl ? ME.photoUrl : undefined });
    n.onclick = ()=>{ window.focus(); n.close(); };
  }catch(err){ console.error('Could not show device notification:', err); }
}

// Diffs the just-refreshed notifications/threads against what we've already
// notified for, and fires a device notification for anything genuinely new.
// Called after every loadFromFirebase() so it runs on the 7s background sync.
function notifyNewActivity(){
  if(!notifBaselineDone){
    // First load after sign-in: record everything as "already seen" instead
    // of notifying for a person's entire notification history at once.
    notifications.forEach(n=>seenNotificationIds.add(n.id));
    threads.forEach(t=>{ seenThreadTimestamps[t.uid] = t.lastTs||0; });
    notifBaselineDone = true;
    return;
  }
  notifications.forEach(n=>{
    if(!seenNotificationIds.has(n.id)){
      seenNotificationIds.add(n.id);
      showDeviceNotification(n.fromName || 'Vamshi', n.text || 'New activity', 'notif-'+n.id);
    }
  });
  threads.forEach(t=>{
    const prevTs = seenThreadTimestamps[t.uid] || 0;
    if((t.lastTs||0) > prevTs){
      seenThreadTimestamps[t.uid] = t.lastTs;
      showDeviceNotification(t.name || 'New message', t.lastText || '', 'thread-'+t.uid);
    }
  });
}

let messageActionTarget = null; // id of the message the action sheet is open for
let lastBubbleTap = { id:null, time:0 };
function conversationIdFor(uidA, uidB){ return [uidA, uidB].sort().join('_'); }

async function loadThreads(){
  if(!ME) return;
  try{
    const raw = await fbGet(`threads/${ME.uid}`);
    threads = Object.entries(raw||{})
      .map(([uid,t])=>({uid, ...t}))
      .sort((a,b)=>(b.lastTs||0)-(a.lastTs||0));

}

async function loadConversation(otherUid){
  if(!ME || !otherUid) return;
  try{
    const raw = await fbGet(`messages/${conversationIdFor(ME.uid, otherUid)}`);
    conversationMessages = Object.entries(raw||{})
      .map(([id,m])=>({id, ...m}))
      .sort((a,b)=>a.createdAt-b.createdAt);
  }catch(err){ console.error('Could not load conversation:', err); }
}

async function openConversation(uid){

  activeConversationUid = uid;
  view = 'conversation';

function scrollConvoToBottom(){

  if(el) el.scrollTop = el.scrollHeight;
}

async function sendMessage(toUid, text){
  const clean = (text||'').trim();
  if(!toUid || !clean || !ME) return;
  const convoId = conversationIdFor(ME.uid, toUid);
  const msg = { from: ME.uid, to: toUid, text: clean, createdAt: Date.now() };

  // Show it immediately, then persist.
  conversationMessages.push({ id:'local-'+Date.now(), ...msg });
  render();
  scrollConvoToBottom();

  try{
    await fbPost(`messages/${convoId}`, msg);

    const other = allUsers.find(u=>u.uid===toUid)
      || (viewingCreator && viewingCreator.uid===toUid ? viewingCreator : null);

    await fbPatch(`threads/${ME.uid}`, { [toUid]: {
      otherUid: toUid,
      name: other ? other.name : 'User',
      handle: other ? other.handle : '',
      photoUrl: other ? (other.photoUrl||null) : null,
      lastText: clean,
      lastTs: msg.createdAt
    }});
    await fbPatch(`threads/${toUid}`, { [ME.uid]: {
      otherUid: ME.uid,
      name: ME.name,
      handle: ME.handle,
      photoUrl: ME.photoUrl || null,
      lastText: clean,
      lastTs: msg.createdAt
    }});

    sendNotification(toUid, { type:'message', text:`${ME.name} sent you a message` });

    // A message we just sent updates our own thread's lastTs too — record it
    // now so the next background sync doesn't mistake it for new activity
    // and fire a device notification for our own outgoing message.
    seenThreadTimestamps[toUid] = msg.createdAt;

    syncStatus='online';
    await loadConversation(toUid);
    await loadThreads();
    render();
    scrollConvoToBottom();
  }catch(err){
    console.error('Could not send message:', err);
    syncStatus='offline';
  }
}

async function deleteMessageForEveryone(messageId){

// Re-pulls this device's own follower/following numbers (and followingIds,
// in case you followed someone from another phone) straight from Firebase.
// Without this, ME stayed frozen at whatever it was when you signed in, so a
// follow that happened on a different device never showed up here.
async function refreshMyCounts(){
  try{
    const fresh = await fbGet(`users/${ME.uid}`);
    if(!fresh) return;
    if(fresh.banned){ try{ await auth.signOut(); }catch(e){} return; }
    ME.following = Object.keys(fresh.followingIds || {}).length;
    ME.followingIds = fresh.followingIds || {};
    syncStatus='online';
  }catch(err){ console.error('Could not refresh follower/following counts:', err); syncStatus='offline'; }
}

/* ---------------- VOICE / VIDEO CALLS (WebRTC, signaled over Firebase) ----------------
 * Realtime Database here is REST-only (no onValue listeners — see fbGet/fbPost above),
 * so signaling is done by short-interval polling instead of push events:
 *   - callInvites/{uid}/{callId}   -> ringing invites waiting for that person (polled every ~4s)
 *   - calls/{callId}/participants  -> who has actually joined (polled every ~2s while on a call)
 *   - calls/{callId}/signals/{a__b}-> offer/answer/ICE exchanged between each pair of participants
 * For any given pair, whichever uid sorts first (string compare) is always the offerer —
 * deterministic, so it works the same whether it's a 1-1 call or a mesh of several people,
 * and avoids two people racing to both send offers at once.
 * NOTE: only public STUN is configured (no TURN server), so a call between two networks
 * that both use strict/symmetric NAT may fail to connect — that requires a TURN relay,
 * which isn't something this static, serverless app has.
 */
// Whether the user has turned Shorts sound on. Global (not per-video) so the
// preference carries over as they scroll between Shorts, instead of every
// freshly-mounted <video> silently reverting to muted.
let shortsSoundOn = false;

const ICE_SERVERS = [
  { urls:'stun:stun.l.google.com:19302' },
  { urls:'stun:stun1.l.google.com:19302' },
  // STUN alone can't traverse symmetric NATs (common on carrier/mobile and
  // corporate networks) — calls between two such users would just hang
  // trying to connect. A TURN relay is the fallback for that case. Swap in
  // your own TURN credentials before shipping; this placeholder will not work.
  { urls:'turn:YOUR_TURN_SERVER:3478', username:'YOUR_TURN_USERNAME', credential:'YOUR_TURN_CREDENTIAL' }
];
let activeCall = null;        // { callId, type:'video'|'voice', isGroup } while ringing-out or on an active call
let callStatus = 'idle';      // 'idle' | 'ringing-out' | 'active'
let incomingCall = null;      // { callId, type, callerUid, callerName, callerPhoto, isGroup } while an invite banner is showing
let localStream = null;
let peerConnections = {};     // otherUid -> RTCPeerConnection
let remoteStreams = {};       // otherUid -> MediaStream
let callParticipantsMeta = {};// uid -> {name,photoUrl} for everyone currently in the call (for tile labels)
let callMuted = false;
let callCamOff = false;

/* ---------------- RINGTONE ----------------
 * Synthesized in-browser with the Web Audio API (no audio files to host).
 * Loops a phone-style ring cadence until stopRingtone() is called from
 * accept/decline/cancel or the invite disappearing on its own.
 */
const RINGTONES = [
  { id:'classic', name:'Classic Ring', tones:[480,620] },
  { id:'chime',   name:'Gentle Chime', tones:[660,880,990] },
  { id:'digital', name:'Digital Pulse', tones:[880] },
  { id:'marimba', name:'Marimba', tones:[523,659,784] },
];
let ringtoneCtx = null;
let ringtoneLoopTimer = null;

function playRingtoneBurst(tones, durationMs){
  try{
    if(!ringtoneCtx) ringtoneCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(ringtoneCtx.state==='suspended') ringtoneCtx.resume().catch(()=>{});
    const now = ringtoneCtx.currentTime;
    tones.forEach((freq,i)=>{
      const osc = ringtoneCtx.createOscillator();
      const gain = ringtoneCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.18, now+0.03);
      gain.gain.setValueAtTime(0.18, now + durationMs/1000 - 0.05);
      gain.gain.linearRampToValueAtTime(0, now + durationMs/1000);
      osc.connect(gain).connect(ringtoneCtx.destination);
      osc.start(now + i*0.001);
      osc.stop(now + durationMs/1000 + 0.02);
    });
  }catch(err){ console.error('Ringtone playback failed:', err); }
}

// Loops "ring — ring — pause" like a real phone, using whichever ringtone the
// person picked in Settings (falls back to Classic).
function startRingtone(ringtoneId){
  stopRingtone();
  const tone = RINGTONES.find(r=>r.id===ringtoneId) || RINGTONES[0];
  const cycle = ()=>{
    playRingtoneBurst(tone.tones, 700);
    setTimeout(()=>playRingtoneBurst(tone.tones, 700), 900);
  };
  cycle();
  ringtoneLoopTimer = setInterval(cycle, 3200);
}
function stopRingtone(){
  if(ringtoneLoopTimer){ clearInterval(ringtoneLoopTimer); ringtoneLoopTimer=null; }
}
// Used by the Settings screen so people can hear a ringtone before picking it.
function previewRingtone(ringtoneId){
  startRingtone(ringtoneId);
  setTimeout(stopRingtone, 3400);
}
let callPollTimer = null;
let incomingCallPollTimer = null;
let handledCallCandidateIds = {}; // dedupe so the same ICE candidate isn't applied twice across polls
let showCallPicker = false;   // "start a call" contact-picker modal (for group calls from Messages)
let callPickerSelected = {};  // uid -> true, selections inside that picker
let callPickerQuery = '';

function pairKey(a,b){ return [a,b].sort().join('__'); }

async function joinCallMedia(type){
  const constraints = type==='video' ? { video:{facingMode:'user'}, audio:true } : { video:false, audio:true };
  localStream = await navigator.mediaDevices.getUserMedia(constraints);
}

function createPeerConnection(callId, otherUid){
  const pc = new RTCPeerConnection({ iceServers:ICE_SERVERS });
  peerConnections[otherUid] = pc;
  if(localStream) localStream.getTracks().forEach(t=>pc.addTrack(t, localStream));
  const remote = new MediaStream();
  remoteStreams[otherUid] = remote;
  pc.ontrack = (e)=>{
    e.streams[0].getTracks().forEach(t=>{ if(!remote.getTracks().includes(t)) remote.addTrack(t); });
    renderCallUI();
  };
  pc.onicecandidate = (e)=>{
    if(e.candidate){
      fbPost(`calls/${callId}/signals/${pairKey(ME.uid,otherUid)}/candidates/${ME.uid}`, e.candidate.toJSON())
        .catch(err=>console.error('Could not send ICE candidate:', err));
    }
  };
  return pc;
}

async function createPeerAndOffer(callId, otherUid){
  const pc = createPeerConnection(callId, otherUid);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await fbPut(`calls/${callId}/signals/${pairKey(ME.uid,otherUid)}/offer`, { type:offer.type, sdp:offer.sdp });
}

// uids: everyone to invite, NOT including yourself.
async function startCall(uids, type){
  if(!uids || uids.length===0) return;
  if(callStatus!=='idle'){ alert('You are already on a call.'); return; }
  const callId = 'c'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  try{
    await joinCallMedia(type);
  }catch(err){
    console.error('Could not access camera/microphone:', err);
    alert('Could not access your camera/microphone. Check your browser permissions and try again.');
    return;
  }
  try{
    const meta = { name:ME.name, photoUrl:ME.photoUrl||null };
    callParticipantsMeta = { [ME.uid]:meta };
    uids.forEach(uid=>{
      const u = allUsers.find(x=>x.uid===uid);
      callParticipantsMeta[uid] = { name:u?u.name:'User', photoUrl:u?(u.photoUrl||null):null };
    });
    await fbPut(`calls/${callId}/meta`, {
      type, callerUid:ME.uid, callerName:ME.name, callerPhoto:ME.photoUrl||null,
      isGroup:uids.length>1, status:'ringing', createdAt:Date.now()
    });
    await fbPut(`calls/${callId}/invited`, Object.fromEntries(uids.map(u=>[u,true])));
    await fbPut(`calls/${callId}/participants/${ME.uid}`, meta);
    await Promise.all(uids.map(uid=>fbPut(`callInvites/${uid}/${callId}`, {
      type, callerUid:ME.uid, callerName:ME.name, callerPhoto:ME.photoUrl||null,
      isGroup:uids.length>1, createdAt:Date.now()
    })));
    uids.forEach(uid=>sendNotification(uid, {
      type:'call', text:`${ME.name} started a ${type==='video'?'video':'voice'} call`, callId
    }));
    activeCall = { callId, type, isGroup:uids.length>1 };
    callStatus = 'ringing-out';
    handledCallCandidateIds = {};
    startCallSignalPolling();
    renderCallUI();
  }catch(err){
    console.error('Could not start call:', err);
    alert('Could not start the call: '+(err && err.message ? err.message : 'unknown error')+'\n\nIf this keeps happening, your Firebase Realtime Database rules likely need to allow read/write on the "calls" and "callInvites" paths.');
    endCall(false);
  }
}

async function acceptIncomingCall(){
  if(!incomingCall) return;
  const { callId, type, callerUid, callerName, callerPhoto, isGroup } = incomingCall;
  stopRingtone();
  try{
    await joinCallMedia(type);
  }catch(err){
    console.error('Could not access camera/microphone:', err);
    alert('Could not access your camera/microphone. Check your browser permissions and try again.');
    return;
  }
  activeCall = { callId, type, isGroup };
  callParticipantsMeta = { [ME.uid]:{name:ME.name,photoUrl:ME.photoUrl||null}, [callerUid]:{name:callerName,photoUrl:callerPhoto||null} };
  callStatus = 'active';
  incomingCall = null;
  handledCallCandidateIds = {};
  try{ await fbDelete(`callInvites/${ME.uid}/${callId}`); }catch(err){ console.error(err); }
  try{ await fbPut(`calls/${callId}/participants/${ME.uid}`, { name:ME.name, photoUrl:ME.photoUrl||null }); }
  catch(err){ console.error('Could not join call:', err); }
  startCallSignalPolling();
  renderCallUI();
}

async function declineIncomingCall(){
  if(!incomingCall) return;
  const { callId } = incomingCall;
  stopRingtone();
  try{ await fbDelete(`callInvites/${ME.uid}/${callId}`); }catch(err){ console.error(err); }
  try{ await fbPut(`calls/${callId}/declines/${ME.uid}`, true); }catch(err){ console.error(err); }
  incomingCall = null;
  renderCallUI();
}

function startCallSignalPolling(){
  stopCallSignalPolling();
  callPollTimer = setInterval(pollCallSignals, 2000);
  pollCallSignals();
}
function stopCallSignalPolling(){
  if(callPollTimer){ clearInterval(callPollTimer); callPollTimer=null; }
}

async function pollCallSignals(){
  if(!activeCall) return;
  const callId = activeCall.callId;
  try{
    const participants = await fbGet(`calls/${callId}/participants`) || {};
    const otherUids = Object.keys(participants).filter(u=>u!==ME.uid);
    if(callStatus==='ringing-out' && otherUids.length>0) callStatus='active';

    // Someone left (or the call room shrank) — drop their connection/tile.
    Object.keys(peerConnections).forEach(uid=>{
      if(!otherUids.includes(uid)){
        try{ peerConnections[uid].close(); }catch(err){}
        delete peerConnections[uid]; delete remoteStreams[uid];
        if(uid!==ME.uid) delete callParticipantsMeta[uid];
      }
    });

    if(otherUids.length===0 && callStatus==='active' && !activeCall.isGroup){
      endCall(true); // the other person on a 1-1 call left
      return;
    }

    // Handle every other participant concurrently rather than one at a time —
    // on a group call, waiting on each person's signal fetch/answer/candidates
    // in series before starting the next person's was adding a full extra
    // round trip of latency per participant, every 2-second poll.
    await Promise.all(otherUids.map(async uid=>{
      callParticipantsMeta[uid] = participants[uid];
      const key = pairKey(ME.uid, uid);
      const sig = await fbGet(`calls/${callId}/signals/${key}`) || {};
      const iAmOfferer = ME.uid < uid;

      if(!peerConnections[uid]){
        if(iAmOfferer){
          if(!sig.offer) await createPeerAndOffer(callId, uid);
        }else if(sig.offer){
          const pc = createPeerConnection(callId, uid);
          await pc.setRemoteDescription(new RTCSessionDescription(sig.offer));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          await fbPut(`calls/${callId}/signals/${key}/answer`, { type:answer.type, sdp:answer.sdp });
        }
        return;
      }

      const pc = peerConnections[uid];
      if(iAmOfferer && sig.answer && pc.signalingState==='have-local-offer'){
        await pc.setRemoteDescription(new RTCSessionDescription(sig.answer));
      }
      const theirCandidates = (sig.candidates && sig.candidates[uid]) || {};
      const newCandidates = Object.entries(theirCandidates).filter(([cid])=>!handledCallCandidateIds[key+':'+cid]);
      await Promise.all(newCandidates.map(async ([cid, cand])=>{
        handledCallCandidateIds[key+':'+cid] = true;
        try{ await pc.addIceCandidate(new RTCIceCandidate(cand)); }
        catch(err){ console.error('Could not add ICE candidate:', err); }
      }));
    }));
    renderCallUI();
  }catch(err){ console.error('Call signal poll failed:', err); }
}

// remoteInitiated: true when we're reacting to the other side already having
// left (so there's no need to also clear our own participants entry — it's
// fine to, but the room may already be gone). false for a manual hang-up/cancel.
async function endCall(remoteInitiated){
  const call = activeCall;
  stopCallSignalPolling();
  Object.values(peerConnections).forEach(pc=>{ try{ pc.close(); }catch(err){} });
  peerConnections = {}; remoteStreams = {}; callParticipantsMeta = {};
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  callMuted=false; callCamOff=false; callStatus='idle'; activeCall=null;
  if(call && !remoteInitiated){
    try{ await fbDelete(`calls/${call.callId}/participants/${ME.uid}`); }catch(err){ console.error(err); }
  }
  renderCallUI();
}

// Hanging up while nobody has joined yet: also clear the ringing invites so
// the other side's phone stops showing "incoming call" for a call that's over.
async function cancelOutgoingCall(){
  if(!activeCall){ return; }
  const { callId } = activeCall;
  try{
    const invited = await fbGet(`calls/${callId}/invited`) || {};
    await Promise.all(Object.keys(invited).map(uid=>fbDelete(`callInvites/${uid}/${callId}`).catch(()=>{})));
  }catch(err){ console.error(err); }
  await endCall(false);
}

function toggleCallMute(){
  callMuted = !callMuted;
  if(localStream) localStream.getAudioTracks().forEach(t=>{ t.enabled = !callMuted; });
  renderCallUI();
}
function toggleCallCam(){
  callCamOff = !callCamOff;
  if(localStream) localStream.getVideoTracks().forEach(t=>{ t.enabled = !callCamOff; });
  renderCallUI();
}

function startIncomingCallPolling(){
  if(incomingCallPollTimer) return;
  // Faster than the general 4s cadence used to feel — a call that's over in
  // 3-4 rings shouldn't spend half of that not yet showing the banner.
  incomingCallPollTimer = setInterval(pollIncomingCalls, 2000);
  pollIncomingCalls();
}
function stopIncomingCallPolling(){
  if(incomingCallPollTimer){ clearInterval(incomingCallPollTimer); incomingCallPollTimer=null; }
  stopRingtone();
}
async function pollIncomingCalls(){
  if(!ME) return;
  if(callStatus!=='idle') return; // already on/starting a call — don't show a second incoming banner
  try{
    const invites = await fbGet(`callInvites/${ME.uid}`) || {};
    const ids = Object.keys(invites);
    if(ids.length===0){
      if(incomingCall){ incomingCall=null; stopRingtone(); renderCallUI(); }
      return;
    }
    const callId = ids[0];
    const inv = invites[callId];
    if(!incomingCall || incomingCall.callId!==callId){
      incomingCall = { callId, type:inv.type, callerUid:inv.callerUid, callerName:inv.callerName, callerPhoto:inv.callerPhoto||null, isGroup:!!inv.isGroup };
      startRingtone(ME.ringtone);
      showDeviceNotification(
        `Incoming ${inv.type==='video'?'video':'voice'} call`,
        inv.callerName ? `${inv.callerName} is calling` : 'Someone is calling',
        'call-'+callId
      );
      renderCallUI();
    }
  }catch(err){ console.error('Could not check for incoming calls:', err); }
}

// Rebuilds ONLY #callRoot — never touched by the main render(), so an active
// call's <video> elements survive the app's normal background-sync re-renders.
function renderCallUI(){
  const root = document.getElementById('callRoot');
  if(!root) return;
  if(incomingCall && callStatus==='idle'){
    root.innerHTML = incomingCallBanner();
    bindIncomingCallBanner();
    return;
  }
  if(!activeCall){ root.innerHTML=''; return; }
  root.innerHTML = callOverlayHTML();
  bindCallOverlay();
  const localEl = document.getElementById('callLocalVideo');
  if(localEl && localStream) localEl.srcObject = localStream;
  Object.entries(remoteStreams).forEach(([uid,stream])=>{
    const el = document.getElementById('callRemote_'+uid);
    if(el) el.srcObject = stream;
  });
}

async function openCreatorProfile(uid){
  if(!uid || uid===ME.uid){
    view='profile';
    profileTab='posts';
    render();
    window.scrollTo(0,0);
    return;
  }

  let found = allUsers.find(u=>u.uid===uid);

  // If this account isn't in our locally cached allUsers yet (e.g. they
  // signed up after our last directory sync, or we're opening them from a
  // screen — like a freshly-followed row — before a full resync ran), fetch
  // their real profile directly instead of falling back to a generic
  // "User" placeholder with no name/photo.
  if(!found){
    // Show something immediately so the tap feels responsive, then swap in
    // the real data once it arrives.
    viewingCreator = {
      uid, name:'User', handle:'', photoUrl:null,
      following:!!(ME.followingIds && ME.followingIds[uid]),
      followers:followerCounts[uid]||0, followingCount:0
    };
    view='creatorProfile';
    render();
    window.scrollTo(0,0);

    try{
      const fresh = await fbGet(`users/${uid}`);
      if(fresh){
        found = {
          uid,
          name: fresh.name || 'User',
          handle: fresh.handle || '',
          photoUrl: fresh.photoUrl || null,
          following: !!(ME.followingIds && ME.followingIds[uid]),
          followingIds: fresh.followingIds || {},
          followers: followerCounts[uid] || 0,
          followingCount: Object.keys(fresh.followingIds || {}).length
        };
        allUsers.push(found); // cache it so the next tap is instant
      }
    }catch(err){ console.error('Could not load profile for', uid, err); }

    if(!found || view!=='creatorProfile') return; // user navigated away meanwhile
  }

  viewingCreator = found
    ? {...found}
    : {
        uid,
        name:'User',
        handle:'',
        photoUrl:null,
        following:!!ME.followingIds[uid],
        followers:followerCounts[uid]||0,
        followingCount:0
      };

  // Use the latest locally loaded follower tally immediately.
  viewingCreator.followers = followerCounts[uid] || viewingCreator.followers || 0;
  view='creatorProfile';
  render();
  window.scrollTo(0,0);
}

// Crowd-reporting moderation: this app can't automatically detect "inappropriate"
// video content (that needs a real AI moderation service with its own API keys,
// which this file doesn't have configured). What it CAN do is let people flag a
// video; once enough people flag the same video it's removed automatically, and
// the uploader's account picks up a strike. Two strikes bans the account outright.
// Removes a Short and its auto-crossposted Post twin from BOTH local state and
// Firebase, so it stays gone for every device instead of reappearing on the
// next sync. Used by both the report-threshold auto-removal and the
// "delete my own Short" button on the profile.
async function deleteShortEverywhere(shortId){
  const linkedPost = posts.find(p=>p.shortId===shortId);
  shorts = shorts.filter(sh=>sh.id!==shortId);
  posts = posts.filter(p=>p.shortId!==shortId);
  try{ await fetch(fbPath('shorts/'+shortId) + await authQuery(), { method:'DELETE' }); }
  catch(err){ console.error('Could not delete short from Firebase:', err); }
  if(linkedPost && !String(linkedPost.id).startsWith('local-')){
    try{ await fetch(fbPath('posts/'+linkedPost.id) + await authQuery(), { method:'DELETE' }); }
    catch(err){ console.error('Could not delete crossposted post from Firebase:', err); }
  }
}

// Lets a creator remove their own upload — pulls it (and its Posts-feed
// crosspost) off every device, the same as the auto-moderation path does.
async function deleteMyShort(shortId){
  if(!confirm("Delete this Short? It'll also be removed from your Posts. This can't be undone.")) return;
  await deleteShortEverywhere(shortId);
  render();
}

async function reportShort(s){
  const newCount = (s.reports||0) + 1;
  s.reports = newCount;
  try{ await fbPatch('shorts/'+s.id, { reports:newCount }); }catch(err){ console.error(err); }

  if(newCount >= REPORT_THRESHOLD){
    await deleteShortEverywhere(s.id);

    if(s.authorId){
      try{
        const targetProfile = await fbGet(`users/${s.authorId}`) || {};
        const strikes = (targetProfile.strikes||0) + 1;
        const banned = strikes >= STRIKE_BAN_THRESHOLD;
        await fbPatch(`users/${s.authorId}`, { strikes, banned });
      }catch(err){ console.error('Could not update uploader strikes:', err); }
    }
    alert('Thanks — this video was removed after multiple reports.');
  }else{
    alert('Thanks for the report. Our team reviews flagged videos.');
  }
  render();
}

// Toggles a short's like, in place, without a full re-render (so the playing
// video isn't interrupted). Persists via a per-user likedBy key rather than
// patching a shared counter directly — same reasoning as followingIds below:
// a write to your own key always passes, a write to someone else's field
// often doesn't.
async function setShortLiked(id, liked){
  const s = shorts.find(sh=>sh.id===id);
  if(!s || !!s.liked===!!liked) return;
  s.liked = liked;
  s.likes += liked ? 1 : -1;
  const btn = document.querySelector(`[data-short-like="${id}"]`);
  if(btn){
    btn.classList.toggle('liked', !!liked);
    btn.querySelector('span').textContent = s.likes;
  }
  try{
    if(liked) await fbPatch(`shorts/${id}/likedBy`, { [ME.uid]: true });
    else await fbDelete(`shorts/${id}/likedBy/${ME.uid}`);
    syncStatus='online';
    if(liked && s.authorId) sendNotification(s.authorId, { type:'like_short', text:`${ME.name} liked your Short`, targetId:id });
  }catch(err){ console.error('Could not sync short like:', err); syncStatus='offline'; }
}

// Shared by the mute button and the swipe gesture below, so both stay in sync.
// Sound preference is global (like every other short-form video app): toggling
// it on one Short applies to whichever Short is in view next, instead of
// resetting to muted the moment a new <video> element is created.
function toggleShortSound(shortEl){
  if(!shortEl) return;
  const vid = shortEl.querySelector('video[data-video]');
  if(!vid) return;
  shortsSoundOn = vid.muted; // vid.muted is about to flip, so this is the new "on" state
  vid.muted = !vid.muted;
  const btn = shortEl.querySelector('[data-mute]');
  if(btn) btn.innerHTML = vid.muted ? icon.mute : icon.unmute;
  spawnSoundFlash(shortEl, vid.muted);
}

function spawnSoundFlash(shortEl, muted){
  const flash = document.createElement('div');
  flash.className = 'short-sound-flash';
  flash.innerHTML = muted ? icon.mute : icon.unmute;
  shortEl.appendChild(flash);
  setTimeout(()=>flash.remove(), 600);
}

// Opens/closes the sheet by touching only #modalRoot — a full render() would
// tear down and remount every Short video mid-scroll (see startBackgroundSync's
// note on why that view is special-cased), so this stays fully self-contained.
function openShortComments(shortId){
  showShortComments = shortId;
  document.getElementById('modalRoot').innerHTML = shortCommentsModal();
  bindShortCommentsModal();
}
function closeShortComments(){
  showShortComments = null;
  document.getElementById('modalRoot').innerHTML = '';
}
function bindShortCommentsModal(){
  const back = document.getElementById('shortCommentsBack');
  if(back) back.onclick = (e)=>{ if(e.target.id==='shortCommentsBack') closeShortComments(); };
  const closeBtn = document.getElementById('closeShortComments');
  if(closeBtn) closeBtn.onclick = closeShortComments;
  const submitBtn = document.getElementById('shortCommentSubmit');
  if(submitBtn) submitBtn.onclick = ()=>submitShortComment(showShortComments);
  const input = document.getElementById('shortCommentInput');
  if(input){
    input.focus();
    input.onkeydown = (e)=>{ if(e.key==='Enter') submitShortComment(showShortComments); };
  }
}

// Refreshes just the open sheet's list and the rail's comment count — no
// full render(), same reasoning as openShortComments above.
function refreshShortCommentsUI(shortId){
  const s = shorts.find(sh=>sh.id===shortId);
  if(!s) return;
  const countEl = document.querySelector(`[data-short-comment="${shortId}"] span`);
  if(countEl) countEl.textContent = s.comments.length;
  const list = document.getElementById('shortCommentsList');
  if(list) list.innerHTML = renderShortCommentsList(s.comments);
}

async function submitShortComment(shortId){
  const input = document.getElementById('shortCommentInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  const s = shorts.find(sh=>sh.id===shortId);
  if(!s) return;
  input.value = '';
  const comment = { name:ME.name, text, createdAt:Date.now() };
  try{
    const res = await fbPost('shorts/'+shortId+'/comments', comment);
    s.comments.push({ ...comment, id:res.name });
    syncStatus='online';
    if(s.authorId) sendNotification(s.authorId, { type:'comment_short', text:`${ME.name} commented: "${text.slice(0,60)}"`, targetId:shortId });
  }catch(err){
    console.error(err);
    s.comments.push({ ...comment, id:'local-'+Date.now() });
    syncStatus='offline';
  }
  refreshShortCommentsUI(shortId);
}

    if(followerList.length===0){
      return tabs + `<div class="empty"><span class="brand">No followers yet</span>When someone follows you, they will appear here.</div>`;

    return tabs + `<div class="panel" style="padding:16px 22px;gap:0;">

  if(mine.length===0){
    return tabs + `<div class="empty"><span class="brand">Nothing here yet</span>Posts you share will show up on your profile.</div>`;

  return tabs + `<div class="post-grid">

function ensureRecaptcha(){
  if(recaptchaVerifier) return recaptchaVerifier;
  recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size:'invisible' });
  return recaptchaVerifier;
}

function bindSignIn(){
  const googleBtn = document.getElementById('googleSignIn');
  if(googleBtn) googleBtn.onclick = async ()=>{
    googleBtn.disabled = true;
    try{ await auth.signInWithPopup(googleProvider); }
    catch(err){
      console.error('Google sign-in failed:', err);
      document.getElementById('app').innerHTML = signInScreen(err.message);
      bindSignIn();
    }
  };

  const sendPhoneCode = document.getElementById('sendPhoneCode');
  if(sendPhoneCode) sendPhoneCode.onclick = async ()=>{
    const input = document.getElementById('phoneNumberInput');
    const number = (input.value || '').trim();
    if(!number.startsWith('+')){
      document.getElementById('app').innerHTML = signInScreen('Include your country code, e.g. +1 555 555 5555.');
      bindSignIn();
      return;
    }
    sendPhoneCode.disabled = true;
    try{
      const verifier = ensureRecaptcha();
      const result = await auth.signInWithPhoneNumber(number, verifier);
      phoneConfirmation = result;
      phoneNumberValue = number;
      phoneStep = 'code';
      document.getElementById('app').innerHTML = signInScreen();
      bindSignIn();
    }catch(err){
      console.error('Sending code failed:', err);
      document.getElementById('app').innerHTML = signInScreen(err.message);
      bindSignIn();
    }
  };

  const verifyPhoneCode = document.getElementById('verifyPhoneCode');
  if(verifyPhoneCode) verifyPhoneCode.onclick = async ()=>{
    const code = (document.getElementById('phoneCodeInput').value || '').trim();
    if(!code || !phoneConfirmation) return;
    verifyPhoneCode.disabled = true;
    try{ await phoneConfirmation.confirm(code); }
    catch(err){
      console.error('Code verification failed:', err);
      document.getElementById('app').innerHTML = signInScreen(err.message);
      bindSignIn();
    }
  };

  const phoneBack = document.getElementById('phoneBack');
  if(phoneBack) phoneBack.onclick = ()=>{
    phoneStep = 'input';
    phoneConfirmation = null;
    document.getElementById('app').innerHTML = signInScreen();
    bindSignIn();
  };
}
